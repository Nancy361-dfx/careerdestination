<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services Section</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0a2540;
  --accent:#0a58ca;
  --navy:#0d1f3c;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body{ background:#fff; }

.services-section{
  padding:80px 6%;
  background:#fafafa;
  text-align:center;
  overflow:hidden;
}

.label{
  display:inline-block;
  padding:8px 22px;
  background:#eef2f3;
  border-radius:20px;
  font-size:15px;
  font-weight:700;
  letter-spacing:1.2px;
  color:#0a58ca;
  margin-bottom:12px;
  opacity:0;
  transform:translateY(-20px);
}

.services-section h2{
  font-size:38px;
  font-weight:600;
  margin-bottom:60px;
  color:#222;
  opacity:0;
  transform:translateY(-20px);
}

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:40px;
  margin-bottom:70px;
}

@keyframes fadeDrop {
  from { opacity:0; transform:translateY(-20px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes springPop {
  0%   { opacity:0; transform: scale(0.4) translateY(50px); }
  55%  { opacity:1; transform: scale(1.1) translateY(-10px); }
  75%  { transform: scale(0.95) translateY(4px); }
  90%  { transform: scale(1.03) translateY(-2px); }
  100% { opacity:1; transform: scale(1) translateY(0); }
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}

.service-card{
  --delay:0s;
  background:#fff;
  border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,0.08);
  overflow:hidden;
  padding-bottom:25px;
  opacity:0;
  transform: scale(0.4) translateY(50px);
  will-change: transform, opacity;
}

.img-wrapper{ position:relative; overflow:hidden; }
.service-card img{
  width:100%;
  height:230px;
  object-fit:cover;
  display:block;
  transition:transform .5s ease;
}
.service-card:hover img{ transform:scale(1.08); }

.img-wrapper::after{
  content:'';
  position:absolute; top:0; left:-100%;
  width:60%; height:100%;
  background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,0.25) 50%,transparent 100%);
  transition:left .55s ease;
  pointer-events:none;
}
.service-card:hover .img-wrapper::after{ left:140%; }

.icon-box{
  width:60px; height:60px;
  background:#fff; border-radius:50%;
  margin:20px auto 15px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  transition: background .3s, box-shadow .3s, transform .3s;
}
.service-card:hover .icon-box{
  background:var(--navy);
  box-shadow:0 12px 30px rgba(13,31,60,0.35);
  transform:rotate(8deg) scale(1.1);
}
.icon-box span{ font-size:26px; line-height:1; color:var(--accent); transition:filter .3s; }
.service-card:hover .icon-box span{ filter:brightness(0) invert(1); }

.service-card h3{ font-size:18px; font-weight:600; margin-top:10px; color:#333; transition:color .3s; }
.service-card:hover h3{ color:var(--navy); }

.service-card::after{
  content:''; display:block; height:3px; width:0;
  background:linear-gradient(90deg, var(--accent), var(--navy));
  margin:0 auto; border-radius:0 0 4px 4px;
  transition:width .4s ease;
}
.service-card:hover::after{ width:80%; }

.more-btn{
  opacity:0;
  transform:translateY(20px);
}

.more-btn a{
  display:inline-flex; align-items:center; gap:8px;
  padding:14px 30px; background:#0a58ca; color:#fff;
  text-decoration:none; font-weight:600; border-radius:8px;
  transition: background .3s, transform .3s, box-shadow .3s;
  position:relative; overflow:hidden;
}
.more-btn a::before{
  content:''; position:absolute; top:0; left:-100%;
  width:100%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  transition:left .5s ease;
}
.more-btn a:hover::before{ left:100%; }
.more-btn a:hover{
  background:var(--navy);
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(13,31,60,.4);
}

/* Same trigger behavior as contact section */
.services-section.in-view .label{ animation:fadeDrop .5s ease forwards; }
.services-section.in-view h2{ animation:fadeDrop .5s ease .12s forwards; }
.services-section.in-view .service-card{ animation:springPop .7s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay:var(--delay); }
.services-section.in-view .more-btn{ animation:fadeUp .6s ease .95s forwards; }

.service-card:nth-child(1){ --delay:.18s; }
.service-card:nth-child(2){ --delay:.26s; }
.service-card:nth-child(3){ --delay:.34s; }
.service-card:nth-child(4){ --delay:.42s; }
.service-card:nth-child(5){ --delay:.50s; }
.service-card:nth-child(6){ --delay:.58s; }
.service-card:nth-child(7){ --delay:.66s; }
.service-card:nth-child(8){ --delay:.74s; }
.service-card:nth-child(9){ --delay:.82s; }

@media(max-width:900px){ .services-grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){
  .services-grid{grid-template-columns:1fr;}
  .services-section h2{font-size:28px;}
  .service-card img{height:200px;}
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important; }
  .label, .services-section h2, .service-card, .more-btn{ opacity:1 !important; transform:none !important; }
}
</style>
</head>
<body>

<section class="services-section" id="servicesSection">
  <div class="label">OUR SERVICE AREAS</div>
  <h2>Industries Connected</h2>

  <div class="services-grid">
    <div class="service-card">
      <div class="img-wrapper"><img src="https://images.unsplash.com/photo-1556761175-4b46a572b786?auto=format&fit=crop&w=900&q=80" alt="Iron and steel industry"></div>
      <div class="icon-box"><span>🏭</span></div>
      <h3>Iron & Steel</h3>
    </div>
    <div class="service-card">
      <div class="img-wrapper"><img src="https://careersdestination.com/wp-content/uploads/2026/01/automobile.png" alt="Automobile industry"></div>
      <div class="icon-box"><span>🚗</span></div>
      <h3>Automobile</h3>
    </div>
    <div class="service-card">
      <div class="img-wrapper"><img src="https://careersdestination.com/wp-content/uploads/2026/01/Manufactring.png" alt="Manufacturing industry"></div>
      <div class="icon-box"><span>⚙️</span></div>
      <h3>Manufacturing</h3>
    </div>
    <div class="service-card">
      <div class="img-wrapper"><img src="https://careersdestination.com/wp-content/uploads/2026/01/ed-tech.png" alt="EdTech industry"></div>
      <div class="icon-box"><span>📚</span></div>
      <h3>EdTech</h3>
    </div>
    <div class="service-card">
      <div class="img-wrapper"><img src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=900&q=80" alt="FinTech industry"></div>
      <div class="icon-box"><span>💳</span></div>
      <h3>FinTech</h3>
    </div>
    <div class="service-card">
      <div class="img-wrapper"><img src="https://careersdestination.com/wp-content/uploads/2026/01/engeering-cunstruction.png" alt="Engineering and construction industry"></div>
      <div class="icon-box"><span>🏗️</span></div>
      <h3>Engineering & Construction</h3>
    </div>
    <div class="service-card">
      <div class="img-wrapper"><img src="https://images.unsplash.com/photo-1587560699334-cc4ff634909a?auto=format&fit=crop&w=900&q=80" alt="BPO and customer support"></div>
      <div class="icon-box"><span>🎧</span></div>
      <h3>BPO & Customer Support</h3>
    </div>
    <div class="service-card">
      <div class="img-wrapper"><img src="https://careersdestination.com/wp-content/uploads/2026/01/pharma.png" alt="Pharmaceutical industry"></div>
      <div class="icon-box"><span>💊</span></div>
      <h3>Pharmaceutical</h3>
    </div>
    <div class="service-card">
      <div class="img-wrapper"><img src="https://careersdestination.com/wp-content/uploads/2026/01/chemical-industry.png" alt="Chemical industry"></div>
      <div class="icon-box"><span>⚗️</span></div>
      <h3>Chemical Industry</h3>
    </div>
  </div>

  <div class="more-btn">
    <a href="#">MORE →</a>
  </div>
</section>

<script>
(function () {
  var section = document.getElementById('servicesSection');
  if (!section) return;

  function restartAnimation() {
    section.classList.remove('in-view');
    void section.offsetWidth;
    section.classList.add('in-view');
  }

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        restartAnimation();
      } else {
        section.classList.remove('in-view');
      }
    });
  }, {
    root: null,
    threshold: 0.25,
    rootMargin: '0px 0px -10% 0px'
  });

  observer.observe(section);
})();
</script>
</body>
</html>
