<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Service - White Theme</title>
  <style>
    :root {
      --section-bg: #ffffff;
      --chip-bg: #eef2f7;
      --chip-text: #2d4f79;
      --heading: #0b1f3f;
      --body: #5f6f85;
      --button: #2b6cb0;
      --button-hover: #1f548b;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      background: #f6f8fb;
      color: var(--heading);
    }

    .service-section {
      background: var(--section-bg);
      padding: 58px 24px 56px;
      width: min(100%, 1280px);
      margin: 0 auto;
    }

    .header {
      text-align: center;
      max-width: 760px;
      margin: 0 auto;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--chip-bg);
      color: var(--chip-text);
      padding: 7px 13px;
      border-radius: 5px;
      font-size: 12px;
      line-height: 1;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .header h2 {
      margin: 0;
      font-size: clamp(30px, 3.6vw, 50px);
      line-height: 1.2;
      letter-spacing: -0.5px;
      font-weight: 700;
    }

    .header p {
      margin: 18px auto 0;
      max-width: 700px;
      font-size: clamp(15px, 1.6vw, 24px);
      line-height: 1.6;
      color: var(--body);
      font-weight: 400;
    }

    .cards {
      margin: 48px auto 0;
      max-width: 1140px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      margin: 0;
      border-radius: var(--radius);
      overflow: hidden;
      background: #f9fbff;
      min-height: 236px;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cta-wrap {
      display: flex;
      justify-content: center;
      margin-top: 38px;
    }

    .cta {
      border: none;
      background: var(--button);
      color: #fff;
      border-radius: 5px;
      padding: 14px 24px;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .cta:hover {
      background: var(--button-hover);
    }

    @media (max-width: 900px) {
      .service-section {
        padding: 48px 18px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 34px;
      }

      .card {
        min-height: 240px;
      }

      .cta-wrap {
        margin-top: 28px;
      }
    }
  </style>
</head>
<body>
  <section class="service-section">
    <header class="header">
      <span class="chip">Our Service</span>
      <h2>Tailored Solutions for Your Hiring Needs</h2>
      <p>
        With our proven track record and commitment to excellence, we're here to support your
        organization's growth and help you achieve your hiring goals.
      </p>
    </header>

    <div class="cards">
      <figure class="card">
        <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=900&q=80" alt="Team brainstorming around a table" />
      </figure>
      <figure class="card">
        <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=900&q=80" alt="Team discussing project plans" />
      </figure>
      <figure class="card">
        <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=900&q=80" alt="Business meeting with documents" />
      </figure>
    </div>

    <div class="cta-wrap">
      <button class="cta">Explore More Services ↗</button>
    </div>
  </section>
</body>
</html>
