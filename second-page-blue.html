<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Widget</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 2px 0 0 14px;
    }

    /* preview frame like your screenshot */
    .preview-area {
      width: 265px;
      height: 70px;
      border: 1px solid #f0b4ff;
      background: #f4f4f4;
      padding: 8px;
    }

    .search-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: #1f1f1f;
      line-height: 1;
    }

    .search-wrap {
      position: relative;
      width: 90px;
    }

    .search-input {
      width: 100%;
      height: 34px;
      border: 1px solid #d8d8d8;
      background: #ffffff;
      font-size: 8px;
      color: #747474;
      padding: 0 16px 0 14px;
      outline: none;
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      line-height: 34px;
    }

    .search-input::placeholder {
      color: #b5b5b5;
    }

    .search-icon {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: #f3a51d;
      line-height: 1;
      pointer-events: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="preview-area">
    <p class="search-title">Search</p>
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Search" />
      <span class="search-icon">⌕</span>
    </div>
  </div>
</body>
</html>
