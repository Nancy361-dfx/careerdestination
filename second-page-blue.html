<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Widget</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 2px 0 0 10px;
    }

    .preview-area {
      width: 267px;
      height: 74px;
      border: 2px solid #f0b4ff;
      background: #f2f2f2;
      padding: 8px 10px;
    }

    .search-title {
      margin: 0 0 9px;
      font-size: 25px;
      font-weight: 700;
      color: #1f1f1f;
      line-height: 1;
    }

    .search-wrap {
      position: relative;
      width: 92px;
    }

    .search-input {
      width: 100%;
      height: 34px;
      border: 1px solid #cfd3d7;
      border-radius: 4px;
      background: #efefef;
      font-size: 8px;
      color: #666;
      padding: 0 16px 0 12px;
      outline: none;
      line-height: 34px;
    }

    .search-input::placeholder {
      color: #8f8f8f;
    }

    .search-icon {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: #f3a51d;
      line-height: 1;
      pointer-events: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="preview-area">
    <p class="search-title">Search</p>
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Search" />
      <span class="search-icon">⌕</span>
    </div>
  </div>
</body>
</html>
