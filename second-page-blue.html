<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Widget</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: start center;
      min-height: 100vh;
      padding-top: 10px;
    }

    .search-card {
      width: 119px;
      background: #f8f8f8;
      border: 1px solid #ececec;
      padding: 8px;
    }

    .search-title {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 700;
      color: #2a2a2a;
      line-height: 1;
    }

    .search-wrap {
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 18px;
      border: 1px solid #e5e5e5;
      background: #ffffff;
      font-size: 8px;
      color: #777;
      padding: 0 14px 0 6px;
      outline: none;
    }

    .search-input::placeholder {
      color: #c0c0c0;
    }

    .search-icon {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 8px;
      color: #f3a51d;
      line-height: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="search-card">
    <p class="search-title">Search</p>
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Search" />
      <span class="search-icon">⌕</span>
    </div>
  </div>
</body>
</html>
