<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Services</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#f4b41a;
  --navy:#0d1f3c;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{ background:#fff; }

.industry-section{
  padding:90px 6%;
  background:#fafafa;
}

/* Heading */
.industry-section h2{
  text-align:center;
  font-size:38px;
  font-weight:600;
  margin-bottom:60px;
  color:#222;
  opacity:0;
  transform:translateY(-24px);
}

.industry-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

/* ===== CARD ===== */
.industry-card{
  --delay:0s;
  position:relative;
  height:360px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 25px 60px rgba(0,0,0,0.15);
  cursor:pointer;
  opacity:0;
  transform:translateY(50px);
  transition:transform .45s cubic-bezier(.25,.8,.25,1), box-shadow .45s ease;
}

.industry-card:hover{
  transform:translateY(-10px) scale(1.02);
  box-shadow:0 40px 80px rgba(13,31,60,0.22);
}

/* ===== BACKGROUND IMAGE DIV ===== */
.card-bg{
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  transition:transform .55s ease;
}
.industry-card:hover .card-bg{ transform:scale(1.1); }

.card-bg-1{
  background-image: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=800&auto=format&fit=crop&q=80');
  background-color: #1a3a6b;
}
.card-bg-2{
  background-image: url('https://images.unsplash.com/photo-1556761175-4b46a572b786?w=800&auto=format&fit=crop&q=80');
  background-color: #1a3b2a;
}
.card-bg-3{
  background-image: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=800&auto=format&fit=crop&q=80');
  background-color: #2a1a0d;
}

/* Shine sweep */
.industry-card::after{
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:55%;
  height:100%;
  background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
  transition:left .6s ease;
  pointer-events:none;
  z-index:2;
}
.industry-card:hover::after{ left:150%; }

/* ===== OVERLAY BOX ===== */
.card-overlay{
  position:absolute;
  left:20px;
  right:20px;
  bottom:20px;
  background:#fff;
  border-radius:14px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
  transition:background .35s ease, box-shadow .35s ease, transform .35s ease;
  z-index:3;
  overflow:hidden;
}
.card-overlay::after{
  content:'';
  position:absolute;
  bottom:0; left:50%;
  transform:translateX(-50%);
  width:0;
  height:3px;
  background:linear-gradient(90deg, #0a58ca, var(--navy));
  border-radius:2px;
  transition:width .4s ease;
}
.industry-card:hover .card-overlay::after{ width:85%; }
.industry-card:hover .card-overlay{
  background:var(--navy);
  box-shadow:0 20px 50px rgba(13,31,60,0.35);
  transform:translateY(-4px);
}

.overlay-text{ flex:1; }
.overlay-text span{
  font-size:16px;
  font-weight:600;
  color:#0a1f44;
  transition:color .3s ease;
}
.industry-card:hover .overlay-text span{ color:#f4b41a; }
.overlay-text h3{
  font-size:14px;
  margin-top:6px;
  font-weight:500;
  color:#222;
  line-height:1.4;
  transition:color .3s ease;
}
.industry-card:hover .overlay-text h3{ color:rgba(255,255,255,0.85); }

.arrow-btn{
  min-width:45px;
  min-height:45px;
  background:var(--accent);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  color:#222;
  transition:transform .35s ease, background .35s ease, box-shadow .35s ease;
  cursor:pointer;
  flex-shrink:0;
}
.industry-card:hover .arrow-btn{
  transform:rotate(45deg) scale(1.12);
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

/* Contact-section style viewport animation */
.industry-section.in-view h2{
  animation:fadeDown .65s ease forwards;
}
.industry-section.in-view .industry-card{
  animation:cardIn .7s cubic-bezier(.2,.75,.2,1) forwards;
  animation-delay:var(--delay);
}
.industry-card:nth-child(1){ --delay:.3s; }
.industry-card:nth-child(2){ --delay:.48s; }
.industry-card:nth-child(3){ --delay:.66s; }

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-24px);} 
  to{opacity:1; transform:translateY(0);} 
}
@keyframes cardIn{
  from{opacity:0; transform:translateY(50px);} 
  to{opacity:1; transform:translateY(0);} 
}

@media(max-width:992px){
  .industry-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .industry-grid{grid-template-columns:1fr;}
  .industry-section h2{font-size:28px;}
  .industry-card{height:320px;}
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important; }
  .industry-section h2, .industry-card{ opacity:1 !important; transform:none !important; }
}
</style>
</head>

<body>

<section class="industry-section" id="industrySection">
  <h2>Our Services</h2>

  <div class="industry-grid">
    <div class="industry-card">
      <div class="card-bg card-bg-1"></div>
      <div class="card-overlay">
        <div class="overlay-text">
          <span>Recruitment Services</span>
          <h3>Connecting the right talent with the right opportunity faster and smarter.</h3>
        </div>
        <div class="arrow-btn">↗</div>
      </div>
    </div>

    <div class="industry-card">
      <div class="card-bg card-bg-2"></div>
      <div class="card-overlay">
        <div class="overlay-text">
          <span>Resume Services</span>
          <h3>Professionally crafted resumes that open doors to better careers.</h3>
        </div>
        <div class="arrow-btn">↗</div>
      </div>
    </div>

    <div class="industry-card">
      <div class="card-bg card-bg-3"></div>
      <div class="card-overlay">
        <div class="overlay-text">
          <span>Disha</span>
          <h3>Guiding talent and organizations toward meaningful career success.</h3>
        </div>
        <div class="arrow-btn">↗</div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  var section = document.getElementById('industrySection');
  if (!section) return;

  function restartAnimation(){
    section.classList.remove('in-view');
    void section.offsetWidth;
    section.classList.add('in-view');
  }

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        restartAnimation();
      } else {
        section.classList.remove('in-view');
      }
    });
  }, { threshold: 0.2 });

  observer.observe(section);
})();
</script>

</body>
</html>
