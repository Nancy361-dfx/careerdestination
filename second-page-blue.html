<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Brand Partners - Motion Logo Section</title>
  <style>
    :root {
      --page-bg: #f2f2f2;
      --line: #e7cfbd;
      --title: #06142e;
      --card-bg: #ffffff;
      --card-border: #f1d6c5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--page-bg);
    }

    .section {
      max-width: 1365px;
      margin: 32px auto;
      padding: 12px 0 22px;
      overflow: hidden;
    }

    .headline-wrap {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin: 0 26px 26px;
    }

    .line { height: 1px; background: var(--line); }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--title);
      text-align: center;
      white-space: nowrap;
    }

    .marquee {
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    }

    .track {
      display: flex;
      gap: 18px;
      width: max-content;
      padding: 8px 0;
      animation: slideLeft 24s linear infinite;
    }

    .track.reverse {
      animation-direction: reverse;
      animation-duration: 26s;
      margin-top: 16px;
    }

    .logo-card {
      width: 188px;
      height: 64px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      padding: 8px 10px;
      flex: 0 0 auto;
    }

    .logo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(12, 32, 74, 0.08);
      border-color: #d9b59d;
    }

    .logo-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: saturate(1.05);
    }

    @keyframes slideLeft {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-50% - 9px)); }
    }

    @media (max-width: 900px) {
      .title { font-size: 15px; }
      .logo-card { width: 160px; height: 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .track,
      .track.reverse { animation: none; }
    }
  </style>
</head>
